name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tự tìm thư mục dự án (repo có thể chứa mã nguồn trong thư mục con)
  locate:
    name: Locate project
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.find.outputs.android }}
      backend: ${{ steps.find.outputs.backend }}
      zip: ${{ steps.find.outputs.zip }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          echo "Cấu trúc repo (3 cấp):"
          find . -maxdepth 3 -not -path './.git' -not -path './.git/*' | sort
          find_android() { find "$1" -name settings.gradle.kts -not -path '*/.git/*' -not -path '*/build/*' | sort | head -n1 | xargs -r dirname; }
          find_backend() { find "$1" -path '*/backend/requirements.txt' -not -path '*/.git/*' | sort | head -n1 | xargs -r dirname; }
          android=$(find_android .)
          backend=$(find_backend .)
          zip=""
          if [ -z "$android" ]; then
            # Trường hợp tải nguyên file source.zip lên repo: giải nén rồi tìm lại
            for z in $(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | sort); do
              if unzip -l "$z" | grep -q 'settings.gradle.kts'; then
                zip="$z"
                echo "Tìm thấy dự án trong file nén: $z → giải nén vào _src/"
                unzip -q -o "$z" -d _src
                android=$(find_android _src)
                backend=$(find_backend _src)
                break
              fi
            done
          fi
          echo "android=${android}" >> "$GITHUB_OUTPUT"
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"
          echo "Android project: ${android:-KHÔNG TÌM THẤY}"
          echo "Backend:         ${backend:-không có}"
          if [ -z "$android" ]; then
            echo "::error::Không tìm thấy settings.gradle.kts (kể cả trong file .zip). Hãy giải nén source.zip và đẩy TOÀN BỘ nội dung (app/, gradle/, gradlew, settings.gradle.kts, build.gradle.kts, gradle.properties, backend/) lên repo."
            exit 1
          fi

  backend-tests:
    name: Backend tests (Provisioning API)
    needs: locate
    if: needs.locate.outputs.backend != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract source zip
        if: needs.locate.outputs.zip != ''
        run: unzip -q -o "${{ needs.locate.outputs.zip }}" -d _src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: ${{ needs.locate.outputs.backend }}
        run: |
          pip install -r requirements.txt
          python -m pytest -q

  android:
    name: Android APK
    needs: locate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT_DIR: ${{ needs.locate.outputs.android }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      # Khóa công khai xác minh cấu hình WireGuard (không bí mật) và địa chỉ Provisioning API mặc định
      CONFIG_SIGNING_PUBLIC_KEY: ${{ vars.CONFIG_SIGNING_PUBLIC_KEY }}
      PROVISIONING_BASE_URL: ${{ vars.PROVISIONING_BASE_URL }}
      # Host của máy chủ WireGuard TP.HCM, app từ chối cấu hình trỏ tới host khác
      GATEWAY_HOST: ${{ vars.GATEWAY_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source zip
        if: needs.locate.outputs.zip != ''
        run: unzip -q -o "${{ needs.locate.outputs.zip }}" -d _src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cài sẵn Gradle 8.11.1 để vẫn build được nếu gradlew / gradle-wrapper.jar bị thiếu khi tải lên
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            GRADLE=./gradlew
          else
            echo "::warning::Thiếu gradlew hoặc gradle/wrapper/gradle-wrapper.jar – dùng Gradle 8.11.1 cài sẵn."
            GRADLE=gradle
          fi
          echo "GRADLE=$GRADLE" >> "$GITHUB_ENV"
          $GRADLE --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/PersonalSecuritySuite-debug-${{ github.run_number }}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalSecuritySuite-debug-${{ github.run_number }}
          path: out/*.apk
          retention-days: 14

      # Bản release đã ký: chỉ chạy khi đã thêm 4 secret KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: $GRADLE --no-daemon --stacktrace assembleRelease

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PersonalSecuritySuite-release-${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk

      # Build lỗi: lưu báo cáo để chẩn đoán
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/
          if-no-files-found: ignore
